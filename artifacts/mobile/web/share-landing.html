<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P2P Global Bible Study Network</title>
  <style>
    body {
      background: #0D1117; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 20px;
    }
    .card { max-width: 400px; text-align: center; }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #B8860B; margin-bottom: 8px; font-size: 22px; }
    .tagline { color: #aaa; margin: 0 0 8px; }
    .content-preview {
      background: #1A2332; border-radius: 12px;
      padding: 16px; margin: 24px 0; text-align: left;
    }
    .content-preview small { color: #888; }
    .content-preview h3 { margin: 8px 0; color: #fff; }
    .content-preview p { margin: 0; color: #aaa; font-size: 14px; }
    .download-btn {
      background: #1D9E75; color: #fff; border: none;
      padding: 16px 32px; border-radius: 8px; font-size: 16px; font-weight: 600;
      cursor: pointer; width: 100%; margin-bottom: 12px;
    }
    .subtitle { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🌳</div>
    <h1>P2P Global Bible Study Network</h1>
    <p class="tagline">Someone shared this with you</p>

    <div class="content-preview" id="preview"></div>

    <button class="download-btn" id="downloadBtn">📱 Open in App</button>
    <p class="subtitle">Free on Android &middot; This content will open automatically if you have the app</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var type = params.get("type");
    var title = params.get("title") || "";
    var desc = params.get("desc") || "";
    var deepLink = params.get("link") || "";

    var typeLabel = type === "lesson" ? "📖 Lesson" : type === "plan" ? "🎯 Plan" : type === "category" ? "📂 Category" : "";
    var preview = document.getElementById("preview");
    if (title) {
      preview.innerHTML =
        "<small>" + typeLabel + "</small>" +
        "<h3></h3>" +
        "<p></p>";
      preview.querySelector("h3").textContent = title;
      preview.querySelector("p").textContent = desc;
    } else {
      preview.style.display = "none";
    }

    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.amentech.p2pglobalbiblestudy";

    document.getElementById("downloadBtn").addEventListener("click", function () {
      if (deepLink) {
        window.location = deepLink;
        // If the app isn't installed, the custom-scheme navigation above is a
        // no-op and the page stays put — fall back to the Play Store after a
        // short delay so an installed app gets a chance to intercept first.
        setTimeout(function () { window.location = PLAY_STORE_URL; }, 1500);
      } else {
        window.location = PLAY_STORE_URL;
      }
    });

    // Also attempt the deep link immediately on load, in case the app is
    // installed — the button above stays as a manual fallback either way.
    if (deepLink) {
      window.location = deepLink;
    }
  </script>
</body>
</html>
