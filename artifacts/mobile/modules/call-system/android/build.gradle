plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.p2pcallsystem'
version = '1.0.0'

android {
  namespace "expo.modules.p2pcallsystem"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  google()
  mavenCentral()
}

// P2PFirebaseMessagingService extends expo-notifications' FCM service. Expo
// autolinking ships expo-notifications as a prebuilt artifact (local maven
// repo, added to every project) unless it's built from source — compile
// against whichever of the two this build uses; the app provides it at runtime.
def expoNotificationsVersion = new groovy.json.JsonSlurper()
  .parse(new File(projectDir, "../../../node_modules/expo-notifications/package.json")).version

dependencies {
  if (findProject(':expo-notifications') != null) {
    compileOnly project(':expo-notifications')
  } else {
    compileOnly "host.exp.exponent:expo.modules.notifications:${expoNotificationsVersion}"
  }
  compileOnly 'com.google.firebase:firebase-messaging:25.0.1'

  // Jetpack Telecom — Android's supported way to integrate VoIP calls with the
  // OS (1.0.1 is the newest release this project's compileSdk 36 can build;
  // 1.1.x needs compileSdk 36.1).
  implementation 'androidx.core:core-telecom:1.0.1'
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
